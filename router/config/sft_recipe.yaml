# config/sft_recipe.yaml — Phase 1 SFT distillation recipe (LOCKED)
#
# Codifies experiment_plan.md §2.1.
# Total: 41,500 samples across 10 domains and 27 datasets.
# Distillation: claude-opus-4-6 (~14k) + claude-sonnet-4-6 (~27.5k).
# Estimated cost: $1,800–$2,200 (see preflight checklist Phase C).
#
# IMPORTANT
# - `distill_model` here refers to the TEACHER model used at distillation
#   time, NOT to the executor pool defined in config/pools.yaml. Teachers and
#   executors are different concepts: the teacher generates the trajectory
#   text; the executor pool is what the trained Router can route to.
# - claude-sonnet-4-6 is a valid TEACHER even though it is not in the
#   executor pool, because it does not appear as a `<route model="...">`
#   value, only as the source of supervision signal.
# - All eval-only benchmark families listed in experiment_plan §1.5 are
#   forbidden as data sources here. The validator script
#   `scripts/availability_probe.py` enforces this at probe time.


schema_ref: data/trajectory_schema.md
plan_ref: experiment_plan.md
pools_ref: config/pools.yaml

# Total target sample count. The yaml is invalid if the actual sum diverges
# by more than 100 from this value (sanity check below).
target_total: 41500
tolerance: 100

# Behavioral mix targets (enforced at distillation time, not at recipe
# definition time; copied here from preflight_checklist for reference).
behavioral_targets:
  lazy_fraction_min: 0.10
  lazy_fraction_max: 0.30
  repair_fraction_min: 0.15
  repair_fraction_max: 0.40

# Difficulty taxonomy used by `difficulty` below.
difficulty_levels: [easy, medium, hard]

# Distillation teachers. Both must be reachable via the configured endpoint.
teachers:
  - id: claude-opus-4-6
    role: hard tasks (deep multi-hop, hard math, code algorithms, formal logic, professional domains, long context)
  - id: claude-sonnet-4-6
    role: easy/medium tasks (single-hop, simple math, mainstream code, commonsense, STEM)

# ---------------------------------------------------------------------------
# Datasets (27 entries, 10 domains)
# ---------------------------------------------------------------------------

datasets:

  # ============================================================
  # Domain 1: Multi-hop QA  (11,000)
  # ============================================================

  - name: hotpotqa_fullwiki
    hf_path: hotpot_qa
    hf_subset: fullwiki
    split: train
    n_samples: 4000
    domain: multihop_qa
    difficulty: medium
    distill_model: claude-sonnet-4-6
    notes: must use fullwiki, not distractor

  - name: 2wikimultihopqa
    hf_path: voidful/2WikiMultihopQA
    split: train
    n_samples: 3000
    domain: multihop_qa
    difficulty: medium
    distill_model: claude-sonnet-4-6

  - name: musique_answerable
    hf_path: dgslibisey/MuSiQue
    split: train
    n_samples: 2500
    domain: multihop_qa
    difficulty: hard
    distill_model: claude-opus-4-6
    notes: 3+ hop, the deepest decomposition signal

  - name: strategyqa
    hf_path: voidful/StrategyQA
    split: train
    n_samples: 1500
    domain: multihop_qa
    difficulty: hard
    distill_model: claude-opus-4-6
    notes: implicit multi-hop, yes/no

  # ============================================================
  # Domain 2: Single-hop / Lazy supervision  (6,000)
  # ============================================================

  - name: nq_open
    hf_path: nq_open
    split: train
    n_samples: 3000
    domain: single_hop_lazy
