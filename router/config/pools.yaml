# config/pools.yaml — Worker model pool + skill pool (LOCKED, v3)
#
# Single source of truth for the closed-vocabulary action space of the Router.
# Referenced by:
#   - data/trajectory_schema.md       (schema cites this file as the vocab source)
#   - experiment_plan.md     (worker pool, skill pool)
#   - scripts/validate_schema.py
#   - scripts/generate_trajectories.py        (distillation prompt enumerates these)
#   - the RL env (action space)
#
# IMPORTANT
# - `verify` is NOT a skill. Verify is a Leader behavior (schema §2).
# - `chain_of_thought` is NOT a skill. It is a reasoning mode, not a router action.
# - `policy_model` is the training backbone. It MUST NOT be a <route> target.
# - `enforcement: strict` enables the per-model allowed_skills whitelist.

version: v3
schema_ref: data/trajectory_schema.md
plan_ref: experiment_plan.md

enforcement: strict
policy_model: Qwen/Qwen2.5-7B-Instruct
default_model: claude-haiku-4-5-20251001

