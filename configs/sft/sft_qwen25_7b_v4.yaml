### model
model_name_or_path: /data/xieht/models/Qwen/Qwen2.5-7B-Instruct-real
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: examples/deepspeed/ds_z3_config.json

### dataset
dataset: router_sft_v4
template: qwen
cutoff_len: 4096
preprocessing_num_workers: 16
dataloader_num_workers: 4
packing: true

### output
output_dir: outputs/router_qwen25_7b_sft_v4
logging_steps: 10
save_steps: 200
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: wandb
run_name: router_qwen25_7b_sft_v4

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
gradient_checkpointing: true
learning_rate: 2.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
max_grad_norm: 1.0
weight_decay: 0.01
bf16: true
ddp_timeout: 180000000
save_total_limit: 3

### eval
val_size: 0.02
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 200
